<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꿈it(잇)다 진로상담실</title>
<script>
/* 예전 주소(index.html#g1, #g3)로 들어오면 수업 페이지로 보냄 */
if(/^#g[13]$/.test(location.hash)){location.replace('class.html'+location.hash);}
</script>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1d2b53;--bg:#f4f6fb;--ink:#1f2433;--sub:#5b6275;--line:#e3e6ee;
  --red:#e63946;--orange:#f57c00;--green:#1f9d74;--blue:#2f6fd6;--yellow:#ffc928}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--navy);color:#fff}
.hd{display:flex;align-items:center;gap:16px;padding:18px 16px}
.logo{width:72px;height:56px;background:#fff;border-radius:14px;display:grid;place-items:center;flex:none}
.hd h1{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(22px,4.4vw,34px);line-height:1.2}
.hd h1 b{color:var(--yellow);font-weight:400}
.hd p{margin:2px 0 0;opacity:.85;font-size:clamp(13px,2.4vw,16px)}
.bar{height:8px;background:linear-gradient(90deg,var(--red) 0 25%,var(--orange) 25% 50%,var(--green) 50% 75%,var(--blue) 75%)}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:28px 0 18px}
.title-row h2{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(24px,4.6vw,34px);color:var(--navy)}
.title-row span{color:var(--sub);font-weight:500}
.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:40px}
.pick{--c:var(--blue);--cl:#e8f0fc;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;text-decoration:none;background:#fff;border:2px solid var(--line);border-radius:24px;padding:34px 22px 30px;transition:transform .12s,box-shadow .12s,border-color .12s}
.pick.class{--c:var(--orange);--cl:#fff3e3}
.pick.sched{--c:var(--green);--cl:#e3f5ee}
.pick:hover,.pick:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 22px rgba(29,43,83,.1);outline:none}
.icon{width:84px;height:84px;border-radius:24px;background:var(--cl);display:grid;place-items:center}
.icon svg{width:44px;height:44px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pick>b,.sid>b{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(30px,5vw,40px);color:var(--c);line-height:1.15}
.pick>small,.sid>small{color:var(--sub);font-size:15px;font-weight:500}
.who{background:var(--c);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:3px 14px}
footer{text-align:center;color:var(--sub);font-size:13px;padding:8px 0 36px}
.hd-btns{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}
.go-home,.home-btn{flex:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:900;font-size:14px;border-radius:999px;padding:7px 14px;white-space:nowrap}
.go-home{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.go-home:hover,.go-home:focus-visible{background:var(--yellow);outline:none}
.home-btn{color:#fff;font-weight:700;font-size:13px;border:1.5px solid rgba(255,255,255,.45);padding:6px 12px}
.home-btn:hover,.home-btn:focus-visible{background:rgba(255,255,255,.14);outline:none}
.go-home svg,.home-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start;margin:28px 0 40px}
.layout .picks{margin-bottom:0}
.quick{order:-1;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 12px;display:grid;gap:8px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.quick h3{margin:0 0 2px;font-family:'Jua',sans-serif;font-weight:400;font-size:20px;color:var(--navy);display:flex;align-items:center;gap:6px}
.quick h3 svg{width:18px;height:18px;stroke:var(--navy);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.qlist li,.qlist a{min-width:0}
.qlist a{--qc:var(--blue);display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;transition:border-color .12s,transform .12s}
.qlist a:hover,.qlist a:focus-visible{border-color:var(--qc);transform:translateX(2px);outline:none}
.qlist .qi{flex:none;width:24px;height:24px;border-radius:7px;background:var(--qc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}
.qlist b{min-width:0;font-size:14px;line-height:1.3;font-weight:700;letter-spacing:-.07em;white-space:nowrap;overflow:hidden;text-overflow:clip}
.qlist .ar{margin-left:auto;color:var(--sub);font-size:12px}
.pick{justify-content:center}
.pick.sched{grid-column:1/-1;flex-direction:row;align-items:stretch;gap:22px;padding:24px}
.sid{flex:none;width:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pick.sched .today{margin-top:0;flex:1;min-width:0;align-content:start}
.today .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media (max-width:700px){.pick.sched{flex-direction:column;align-items:center}.sid{width:auto}.pick.sched .today{width:100%}.today .cols{grid-template-columns:1fr}}
.today{width:100%;margin-top:6px;background:var(--bg);border:1.5px solid #cfeadf;border-radius:16px;padding:10px 10px 8px;text-align:left;display:grid;gap:6px}
.today .th{display:flex;align-items:baseline;justify-content:space-between;font-weight:900;color:var(--navy);font-size:14px}
.today .day{display:grid;gap:6px}
.today .day.next{border-top:1.5px dashed #cfeadf;padding-top:8px;margin-top:2px}
.today .tag{display:inline-block;background:var(--green);color:#fff;border-radius:999px;font-size:12px;padding:1px 9px;margin-right:6px;vertical-align:1px}
.today .next .tag{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.today .th small{color:var(--sub);font-weight:700;font-size:12px}
.today h4{margin:4px 0 0;font-size:13px;font-weight:900;color:var(--green);display:flex;align-items:center;gap:6px}
.today h4 i{font-style:normal;width:18px;height:18px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px}
.today ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.today li{display:flex;align-items:baseline;gap:6px;font-size:14px;line-height:1.35;color:var(--ink);background:#fff;border-radius:9px;padding:4px 8px;flex-wrap:wrap}
.today li .pn{flex:none;font-weight:900;color:var(--orange);font-size:13px}
.today li b{font-weight:700}
.today li em{font-style:normal;font-size:11px;font-weight:700;color:var(--green)}
.today li.off b{text-decoration:line-through;color:var(--sub)}
.today li.off em.why{color:var(--red)}
.today li.now{outline:2px solid var(--orange)}
.today li .dot{flex:none;width:8px;height:8px;border-radius:50%;align-self:center}
.today li small{color:var(--sub);font-size:11px}
.today .none{color:var(--sub);background:none;padding:2px 4px}
@media (max-width:860px){.layout{grid-template-columns:1fr}.quick{order:0;position:static;max-height:none}.qlist{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
@media (max-width:560px){.logo{width:60px;height:48px}.picks{gap:10px}.pick{padding:24px 12px}.picks{grid-template-columns:repeat(2,1fr)}.pick.sched{grid-column:1/-1}.icon{width:64px;height:64px}.go-home span,.home-btn span{display:none}.go-home,.home-btn{padding:8px}}

/* 오늘·내일 목록: 한 줄로, 글자 가볍게 (넘치면 … 으로 줄이고 마우스를 올리면 전체가 보여요) */
.today li{flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap;min-width:0;padding:3px 8px}
.today li b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.today li[data-cd] b{flex:none;max-width:55%}
.today li em.tp{color:var(--navy);font-weight:700}
.today li .pn{font-weight:700;font-size:12.5px}
.today li em,.today li small{flex:none;font-weight:500;white-space:nowrap}
.today li em{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.today li small{margin-left:auto}
.today .th{font-weight:700}
.today h4{font-weight:700}
.today .cols>div{min-width:0}
/* 일정 고치기 */
.sid{text-decoration:none;border-radius:18px}
.sid:focus-visible{outline:3px solid var(--green);outline-offset:4px}
.pick.sched:hover{transform:none}
.today li.ed{cursor:pointer}
.today li.ed:hover{outline:1.5px solid var(--green)}
.today li a{color:inherit;text-decoration:none;display:contents}
.today .add{flex:none;border:1.5px solid var(--green);background:#fff;color:var(--green);font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:0 9px;line-height:20px;cursor:pointer;margin-left:6px}
.today .add:hover{background:var(--green);color:#fff}
.today .th>span:last-child{display:flex;align-items:center}
dialog.ev{border:0;border-radius:20px;padding:0;width:min(440px,calc(100vw - 24px));box-shadow:0 20px 50px rgba(29,43,83,.3)}
dialog.ev::backdrop{background:rgba(29,43,83,.45)}
.ev form{padding:18px 18px 16px}
.ev h3{margin:0 0 10px;font-family:'Jua',sans-serif;font-weight:400;font-size:24px;color:var(--navy)}
.ev h3 small{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
.ev label{display:grid;gap:3px;margin-bottom:9px;font-size:13px;font-weight:700;color:var(--sub)}
.ev input,.ev select,.ev textarea{font:inherit;font-size:15px;font-weight:400;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;width:100%;color:var(--ink);background:#fff}
.ev input:focus,.ev select:focus,.ev textarea:focus{outline:none;border-color:var(--green)}
.ev .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ev .bt .sp{flex:1}
.ev button{font:inherit;font-size:14px;font-weight:700;border-radius:999px;padding:6px 14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.ev button.main{background:var(--green);border-color:var(--green);color:#fff}
.ev button.del{color:var(--red)}
.ev .more{font-size:12px;color:var(--sub);margin:6px 0 0}
.ev .more a{color:var(--green);font-weight:700}
/* 3일치(오늘·내일·모레)가 한 카드에 들어가게 촘촘히 */
.today{gap:3px;padding:8px 10px 7px}
.today .day{gap:2px}
.today .day.next{padding-top:5px;margin-top:2px}
.today .th{font-size:13px}
.today .th small{font-size:11.5px}
.today .tag{font-size:11px;padding:0 8px}
.today .add{line-height:18px;font-size:11px;padding:0 8px}
.today .cols{gap:2px 12px}
.today h4{margin:1px 0 1px;font-size:12px;gap:5px}
.today h4 i{width:15px;height:15px;font-size:10px;border-radius:5px}
.today ul{gap:2px}
.today li{font-size:13px;padding:1px 8px;line-height:1.45;border-radius:7px}
.today li .pn{font-size:12px}
.today li em,.today li small{font-size:11px}
.today .none{font-size:12px;padding:0 4px}
.pick.sched{padding:14px 18px}
.sid{width:150px}
/* 날짜별 옅은 색 구분: 오늘 초록 · 내일 파랑 · 모레 보라 */
.today{background:#fff}
.today .day{border-radius:12px;padding:7px 8px 8px;border:1px solid transparent}
.today .day.d0{background:#eaf7f1;border-color:#cfeadf}
.today .day.d1{background:#ecf2fc;border-color:#d4e2f7}
.today .day.d2{background:#f4eefa;border-color:#e3d6f0}
.today .day.next{border-top-style:solid;margin-top:5px;padding-top:7px}
.today .d1 .tag{color:var(--blue);border-color:var(--blue)}.today .d1 .add{color:var(--blue);border-color:var(--blue)}.today .d1 h4{color:var(--blue)}.today .d1 h4 i{background:var(--blue)}
.today .d2 .tag{color:#8e44ad;border-color:#8e44ad}.today .d2 .add{color:#8e44ad;border-color:#8e44ad}.today .d2 h4{color:#8e44ad}.today .d2 h4 i{background:#8e44ad}
.today .d1 li.ed:hover{background:#dde8fa}.today .d2 li.ed:hover{background:#ebe0f5}
.dtabs button[data-sel="1"]{color:var(--blue);border-color:#d4e2f7}.dtabs button[data-sel="1"][aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.dtabs button[data-sel="2"]{color:#8e44ad;border-color:#e3d6f0}.dtabs button[data-sel="2"][aria-selected="true"]{background:#8e44ad;border-color:#8e44ad;color:#fff}
/* 고칠 수 있는 항목: 연필 표시 */
.today li.ed{position:relative;padding-right:26px}
.today li.ed::after{content:"✏️";position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.35;transition:opacity .15s}
.today li.ed:hover::after,.today li.ed:focus-visible::after{opacity:1}
.today li.ed:hover,.today li.ed:focus-visible{background:#e3f5ee;outline:none}
.today .hint{font-size:11px;color:var(--sub);font-weight:500;margin-left:6px}
@media (max-width:560px){.today .hint{display:none}}
/* ===== 반응형: 노트북·태블릿·휴대폰 ===== */
.wrap{max-width:1240px}
.hd{padding:12px 16px}
.logo{width:62px;height:48px}
.layout{margin:18px 0 26px;gap:18px}
.picks{gap:14px}
/* 업무·수업: 아이콘 왼쪽 + 글자 오른쪽(낮은 가로형) */
.pick.work,.pick.class{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i t" "i s" "i w";justify-items:start;align-items:center;text-align:left;column-gap:18px;row-gap:3px;padding:18px 22px}
.pick.work .icon,.pick.class .icon{grid-area:i;width:70px;height:70px;border-radius:20px}
.pick.work>b,.pick.class>b{grid-area:t;font-size:34px;line-height:1.1}
.pick.work>small,.pick.class>small{grid-area:s}
.pick.work .who,.pick.class .who{grid-area:w}
/* 일정관리 */
.pick.sched{padding:18px 20px;gap:18px}
.sid{width:170px;gap:8px}
.sid .icon{width:66px;height:66px;border-radius:20px}
.sid .icon svg,.pick.work .icon svg,.pick.class .icon svg{width:36px;height:36px}
.sid>b{font-size:34px}
.quick{top:12px}

/* 넓은 노트북·모니터: 바로가기 조금 넓게 */
@media (min-width:1200px){.layout{grid-template-columns:260px minmax(0,1fr)}}
/* 낮은 노트북 화면: 한 화면에 들어오게 더 촘촘히 */
@media (min-width:861px) and (max-height:820px){
  .hd{padding:8px 16px}.hd h1{font-size:28px}.hd p{font-size:14px}.bar{height:6px}
  .layout{margin:14px 0 18px}.pick.sched{padding:14px 18px}.today li{padding:3px 8px}
  .pick.work,.pick.class{padding:12px 20px}.pick.work .icon,.pick.class .icon{width:58px;height:58px}
  .qlist a{padding:4px 8px}.qlist{gap:4px}}
/* 태블릿 */
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .quick{order:0}
  .qlist{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .qlist b{letter-spacing:-.03em}}
/* 작은 태블릿: 일정관리 제목도 가로형으로 */
@media (max-width:700px){
  .pick.sched{flex-direction:column;align-items:stretch;padding:16px}
  .sid{width:auto;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i t" "i s" "i w";justify-items:start;align-items:center;column-gap:14px;row-gap:2px}
  .sid .icon{grid-area:i;width:56px;height:56px}.sid>b{grid-area:t;font-size:30px}.sid>small{grid-area:s}.sid .who{grid-area:w}
  .pick.sched .today{width:100%}
  .today .cols{grid-template-columns:1fr}}
/* 휴대폰 */
@media (max-width:560px){
  .wrap{padding:0 10px}
  .hd{gap:10px;padding:10px 10px}.logo{width:50px;height:40px;border-radius:12px}.logo svg{width:42px}
  .hd h1{font-size:22px}.hd p{font-size:12px}
  .layout{margin:12px 0 18px;gap:12px}
  .picks{gap:10px}
  .pick.work,.pick.class{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 8px}
  .pick.work .icon,.pick.class .icon{width:54px;height:54px;border-radius:16px}
  .pick.work .icon svg,.pick.class .icon svg{width:30px;height:30px}
  .pick.work>b,.pick.class>b{font-size:28px}
  .pick.work>small,.pick.class>small{font-size:13px}
  .pick.sched{padding:14px 12px}
  .today{padding:8px}.today li{font-size:13.5px}
  .qlist{grid-template-columns:1fr 1fr}
  .qlist a{padding:7px 8px}
  .qlist b{font-size:13px;white-space:normal;word-break:keep-all;letter-spacing:-.04em}
  .hd>div:nth-child(2){min-width:0}.hd p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qlist .ar{display:none}}
.dtabs{display:none}
/* 태블릿: 일정관리 제목을 위 한 줄로 → 일정 칸을 넓게 */
@media (max-width:860px){
  .pick.sched{flex-direction:column;align-items:stretch;gap:10px}
  .sid{width:auto;display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"i t w";justify-items:start;align-items:center;column-gap:12px}
  .sid .icon{grid-area:i;width:44px;height:44px;border-radius:14px}.sid .icon svg{width:26px;height:26px}
  .sid>b{grid-area:t;font-size:26px}.sid>small{display:none}.sid .who{grid-area:w;justify-self:end}

/* 휴대폰: 하루씩 탭으로 보기 */
@media (max-width:560px){
  .dtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:4px}
  .dtabs button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid #cfeadf;background:#fff;color:var(--green);border-radius:10px;padding:5px 2px;cursor:pointer;line-height:1.25}
  .dtabs button small{display:block;font-size:10.5px;font-weight:500;color:var(--sub)}
  .dtabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
  .dtabs button[aria-selected="true"] small{color:#e3f5ee}
  .today .day{display:none}
  .today[data-sel="0"] .d0,.today[data-sel="1"] .d1,.today[data-sel="2"] .d2{display:grid}
  .today .day.next{border-top:0;padding-top:0;margin-top:0}
  .today .th .tag{display:none}
  .today li{font-size:13.5px;padding:3px 8px}
  /* 업무·수업: 낮은 가로형 */
  .pick.work,.pick.class{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i t" "i w";text-align:left;justify-items:start;column-gap:10px;row-gap:2px;padding:12px}
  .pick.work>small,.pick.class>small{display:none}
  .pick.work .icon,.pick.class .icon{width:44px;height:44px;border-radius:13px}
  .pick.work .icon svg,.pick.class .icon svg{width:24px;height:24px}
  .pick.work>b,.pick.class>b{font-size:24px}
  .pick.work .who,.pick.class .who{font-size:11px;padding:1px 9px}}
@media (max-width:360px){.qlist{grid-template-columns:1fr}.hd p{display:none}}

<script src="schedule-data.js"></script>
<script>
/* 일정관리 카드: 오늘 수업·일정 */
(function(){
  const box=document.getElementById('todayBox');
  if(typeof scheduleDay!=='function'){box.remove();return}
  const pad=n=>String(n).padStart(2,'0'),W='일월화수목금토';
  const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
  /* 일정의 시간 글자에서 시작 시각(분) 찾기: '5교시' → 그 교시 시작, '15:00' → 15시 */
  function evMin(t){
    t=t||'';let m=t.match(/(\d+)\s*교시/);
    if(m&&PERIODS[m[1]-1])return toMin(PERIODS[m[1]-1]);
    m=t.match(/(\d{1,2}):(\d{2})/);if(m)return +m[1]*60+ +m[2];
    return 24*60;
  }
  let daySel=0;
  function dayBlock(d,label,isToday,idx){
    const ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),nd=new Date(),now=nd.getHours()*60+nd.getMinutes();
    const info=scheduleDay(ds),act=info.classes.filter(c=>!c.blocked).length;
    const isCS=e=>e.cat==='class'||e.cat==='counsel';
    const cs=info.events.filter(isCS),others=info.events.filter(e=>!isCS(e));
    /* 1. 수업·상담: 시간표 수업 + 수업·상담 분류 일정을 시간 순서로 */
    const rows=info.classes.map(c=>({m:toMin(c.start),html:(()=>{
      const on=isToday&&!c.blocked&&now>=toMin(c.start)&&now<toMin(c.start)+45;
      return '<li tabindex="0" data-cd="'+ds+'" data-cp="'+c.p+'" title="'+esc(c.p+'교시 '+c.start+' '+c.name+(c.topic?' · 주제: '+c.topic:'')+(c.plan?' · '+c.plan:'')+(c.blocked?' · 수업 없음 '+c.blocked:''))+'" class="ed'+(c.blocked?' off':'')+(on?' now':'')+'"><span class="pn">'+c.p+'교시 '+c.start+'</span><b>'+esc(c.name)+(c.edited?' ✎':'')+'</b>'
        +(c.topic?'<em class="tp">'+esc(c.topic)+'</em>':c.plan?'<em>'+esc(c.plan)+'</em>':'')+(c.blocked?'<em class="why">수업 없음 · '+esc(c.blocked)+'</em>':c.memo?'<em style="color:var(--sub)">'+esc(c.memo)+'</em>':'')+(on?'<em style="color:var(--orange)">지금</em>':'')+'</li>'})()}))
      .concat(cs.map(e=>({m:evMin(e.time),html:'<li tabindex="0" class="ed" data-k="'+esc(e.key)+'" title="'+esc((e.time?e.time+' ':'')+e.title)+' · 눌러서 고치기"><span class="pn" style="color:'+((CATS[e.cat]||CATS.etc).c)+'">'+(e.time?esc(e.time):(CATS[e.cat]||CATS.etc).name)+'</span><b>'+esc(e.title)+'</b>'+(e.cat==='counsel'?'<em>상담</em>':'')+'</li>'})))
      .sort((a,b)=>a.m-b.m);
    const nC=cs.filter(e=>e.cat==='counsel').length;
    const sum=info.holiday?esc(info.holiday):'수업 '+act+'시간'+(nC?' · 상담 '+nC+'건':'');
    let h='<div class="day d'+idx+(isToday?'':' next')+'"><div class="th"><span><span class="tag">'+label+'</span>'+(d.getMonth()+1)+'. '+d.getDate()+'.('+W[d.getDay()]+')'+(isToday?'<span class="hint">✏️ 누르면 고칠 수 있어요</span>':'')+'</span><span><small>'+sum+'</small><button type="button" class="add" data-add="'+ds+'" title="이 날에 일정 추가">＋</button></span></div>';
    h+='<div class="cols"><div><h4><i>1</i>수업·상담</h4><ul>'+(rows.length?rows.map(r=>r.html).join(''):'<li class="none">수업·상담이 없어요</li>')+'</ul>';
    h+='</div><div><h4><i>2</i>일정</h4><ul>'+(others.length?others.sort((a,b)=>evMin(a.time)-evMin(b.time)).map(e=>
      '<li tabindex="0" class="ed" data-k="'+esc(e.key)+'" title="'+esc(e.title+(e.time?' · '+e.time:''))+' · 눌러서 고치기"><span class="dot" style="background:'+((CATS[e.cat]||CATS.etc).c)+'"></span><b>'+esc(e.title)+'</b>'+(e.time?'<small>'+esc(e.time)+'</small>':'')+'</li>').join(''):'<li class="none">일정이 없어요</li>')+'</ul></div></div></div>';
    return h;
  }
  function render(){
    const d=new Date(),t=new Date(d);t.setDate(d.getDate()+1);
    const t2=new Date(d);t2.setDate(d.getDate()+2);
    const days=[[d,'오늘'],[t,'내일'],[t2,'모레']];
    box.innerHTML='<div class="dtabs" role="tablist">'+days.map(([x,l],i)=>'<button type="button" role="tab" data-sel="'+i+'" aria-selected="'+(daySel===i)+'">'+l+' <small>'+(x.getMonth()+1)+'. '+x.getDate()+'.('+W[x.getDay()]+')</small></button>').join('')+'</div>'
      +days.map(([x,l],i)=>dayBlock(x,l,i===0,i)).join('');
    box.dataset.sel=daySel;
  }
  /* 일정 고치기·추가 */
  const dlg=document.getElementById('evDlg'),f=document.getElementById('evForm');let cur=null;
  document.getElementById('evCat').innerHTML=Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v.name+'</option>').join('');
  function openEv(ev,date){
    cur=ev;f.reset();
    document.getElementById('evTitle').innerHTML=ev?'일정 고치기'+(ev.fid?'<small>고정 일정</small>':''):'일정 추가';
    const v=ev||{start:date,cat:'school'};
    f.title.value=v.title||'';f.start.value=v.start;f.end.value=v.end||'';f.time.value=v.time||'';f.memo.value=v.memo||'';f.cat.value=CATS[v.cat]?v.cat:'etc';
    document.getElementById('evDel').hidden=!ev;document.getElementById('evOrig').hidden=!(ev&&ev.fid&&ev.edited);
    dlg.showModal();f.title.focus();
  }
  /* 휴대폰: 오늘·내일·모레 탭 + 옆으로 밀어 넘기기 */
  box.addEventListener('click',e=>{const t=e.target.closest('[data-sel]');if(!t||t===box)return;daySel=+t.dataset.sel;box.dataset.sel=daySel;box.querySelectorAll('.dtabs button').forEach(b=>b.setAttribute('aria-selected',+b.dataset.sel===daySel))});
  let sx=null,sy=0;
  box.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  box.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5&&getComputedStyle(box.querySelector('.dtabs')).display!=='none'){daySel=Math.max(0,Math.min(2,daySel+(dx<0?1:-1)));box.dataset.sel=daySel;box.querySelectorAll('.dtabs button').forEach(b=>b.setAttribute('aria-selected',+b.dataset.sel===daySel))}},{passive:true});
  box.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('li.ed'))e.target.click()});
  box.addEventListener('click',e=>{
    const a=e.target.closest('[data-add]');if(a){openEv(null,a.dataset.add);return}
    const li=e.target.closest('li.ed');if(!li)return;
    if(li.dataset.cd){openClassEditor(li.dataset.cd,+li.dataset.cp,render);return}
    const ev=SCHED.find(li.dataset.k);if(ev)openEv(ev);
  });
  f.addEventListener('submit',e=>{
    e.preventDefault();let st=f.start.value,en=f.end.value;
    if(en&&en<st)[st,en]=[en,st];if(en===st)en='';
    const data={title:f.title.value.trim(),start:st,end:en,time:f.time.value.trim(),cat:f.cat.value,memo:f.memo.value.trim()};
    if(!data.title)return;SCHED.saveEvent(cur,data);dlg.close();render();
  });
  document.getElementById('evCancel').onclick=()=>dlg.close();
  document.getElementById('evDel').onclick=()=>{if(cur&&confirm('이 일정을 지울까요?')){SCHED.deleteEvent(cur);dlg.close();render()}};
  document.getElementById('evOrig').onclick=()=>{if(cur&&cur.fid){SCHED.resetFixed(cur.fid);dlg.close();render()}};
  window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith('schedule:')){SCHED.refresh();render()}});
  render();setInterval(render,60000);
})();
</script>
<script>
/* ▼ 바로가기 목록: 줄을 복사해서 이름·설명·주소·글자·색만 바꾸면 추가돼요.
   색: blue, green, orange, red, navy */
const QUICK_LINKS=[
  {name:'업무포털', desc:'경기도교육청 업무포털', url:'https://goe.eduptl.kr/bpm_lgn_lg00_001.do?noEpSession', mark:'업', color:'navy'},
  {name:'매탄중 업무포털', desc:'매탄중 업무 바로가기 모음', url:'https://jbot.kr/', mark:'매', color:'orange'},
  {name:'원격업무(eVPN)', desc:'경기도교육청 원격업무지원시스템', url:'https://evpn.goe.go.kr', mark:'원', color:'navy'},
  {name:'매탄중학교', desc:'학교 홈페이지', url:'https://maetan-m.goesw.kr/maetan-m/main.do', mark:'학', color:'green'},
  {name:'진로진학 로드맵(내부용)', desc:'꿈it(잇)다 진로·진학 로드맵 내부용', url:'https://limhyunjung07-beep.github.io/01-it-manual-mt/', mark:'로', color:'blue'},
  {name:'진로 상담 도우미', desc:'학생 자료 기반 상담·제공 자료 출력', url:'https://claude.ai/artifact/BjjTmxocAXxkZkcQMXaHGD', mark:'상', color:'green'},
  {name:'고입 진학 상담 도우미', desc:'학교별 요항·서류 작성·모의면접', url:'https://claude.ai/artifact/RVtyAxhJB5RZNaRpgFUEVi', mark:'진', color:'orange'},
  {name:'꿈it(잇)다 사용자 매뉴얼', desc:'꿈it(잇)다 사용자 매뉴얼', url:'https://limhyunjung07-beep.github.io/02-it-manual/', mark:'매', color:'red'},
  {name:'매탄중 패들렛(수업용)', desc:'수업용 패들렛 모음', url:'https://padlet.com/dashboard?mobile_page=Collection&folder_id=2237762', mark:'패', color:'green'},
  {name:'수업 타이머', desc:'타이머·모둠 타이머·스톱워치(전체화면)', url:'timer.html', mark:'타', color:'orange'},
  {name:'집중 음악', desc:'수업 중 집중 음악(유튜브)', url:'https://www.youtube.com/watch?v=nbHPY48rSYQ', mark:'음', color:'red'},
  {name:'수업 도구', desc:'수업용 타이머·이해도 체크·소음 신호등', url:'https://jbot.kr/tools?staff=1', mark:'도', color:'blue'},
];
(function(){
  const C={blue:'var(--blue)',green:'var(--green)',orange:'var(--orange)',red:'var(--red)',navy:'var(--navy)'};
  const ul=document.getElementById('qlist');
  QUICK_LINKS.forEach(l=>{
    const li=document.createElement('li');const a=document.createElement('a');
    a.href=l.url;a.target='_blank';a.rel='noopener';a.style.setProperty('--qc',C[l.color]||C.blue);
    a.title=l.desc?l.name+' · '+l.desc:l.name;
    a.innerHTML='<span class="qi"></span><b></b><span class="ar">↗</span>';
    a.querySelector('.qi').textContent=l.mark||l.name.slice(0,1);
    a.querySelector('b').textContent=l.name;
    li.appendChild(a);ul.appendChild(li);
  });
})();
</script>
</body>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꿈it(잇)다 진로 수업</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1d2b53;--bg:#f4f6fb;--ink:#1f2433;--sub:#5b6275;--line:#e3e6ee;
  --red:#e63946;--orange:#f57c00;--green:#1f9d74;--blue:#2f6fd6;--yellow:#ffc928}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--navy);color:#fff}
.hd{display:flex;align-items:center;gap:16px;padding:18px 16px}
.logo{width:72px;height:56px;background:#fff;border-radius:14px;display:grid;place-items:center;flex:none}
.hd h1{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(22px,4.4vw,34px);line-height:1.2}
.hd h1 b{color:var(--yellow);font-weight:400}
.hd p{margin:2px 0 0;opacity:.85;font-size:clamp(13px,2.4vw,16px)}
.bar{height:8px;background:linear-gradient(90deg,var(--red) 0 25%,var(--orange) 25% 50%,var(--green) 50% 75%,var(--blue) 75%)}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:28px 0 18px}
.title-row h2{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(24px,4.6vw,34px);color:var(--navy)}
.title-row span{color:var(--sub);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:36px}
.card{--c:var(--orange);--cl:#fff3e3;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";height:12px;background:var(--c)}
.in{padding:22px 18px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.badge{background:var(--c);color:#fff;font-weight:900;letter-spacing:.06em;border-radius:999px;padding:4px 18px;font-size:14px}
.card svg{width:34px;height:34px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:30px;color:var(--c);line-height:1.25}
.card p{margin:0;color:var(--sub);font-size:14px}
.items{list-style:none;margin:10px 0 0;padding:14px 0 0;border-top:1.5px dashed #fbd9b0;width:100%;display:grid;gap:8px;text-align:left}
.items a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;background:var(--cl);border:1px solid #fbd9b0;border-radius:12px;padding:10px 12px;transition:transform .12s}
.items a:hover{transform:translateX(3px)}
.items b{background:var(--c);color:#fff;border-radius:7px;padding:1px 7px;font-size:13px;flex:none}
.soon{--c:#a9b0c2;border-style:dashed}
.soon .in{justify-content:center;color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:13px;padding:8px 0 36px}
@media (max-width:560px){.logo{width:60px;height:48px}}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="logo">
      <svg width="54" height="34" viewBox="0 0 54 34" aria-hidden="true"><g fill="none" stroke-width="4.2" stroke-linecap="round">
        <path d="M5 30a22 22 0 0 1 44 0" stroke="#e63946"/><path d="M9.5 30a17.5 17.5 0 0 1 35 0" stroke="#f57c00"/>
        <path d="M14 30a13 13 0 0 1 26 0" stroke="#ffc928"/><path d="M18.5 30a8.5 8.5 0 0 1 17 0" stroke="#1f9d74"/>
        <path d="M23 30a4 4 0 0 1 8 0" stroke="#2f6fd6"/></g></svg>
    </div>
    <div>
      <h1>꿈it(잇)다 <b>진로 수업</b></h1>
      <p>수업별 활동 바로가기 · 매탄중학교 진로상담실</p>
    </div>
  </div>
  <div class="bar"></div>
</header>

<main class="wrap">
  <div class="title-row">
    <h2>오늘의 수업을 골라요</h2>
    <span>선생님이 안내한 번호를 눌러 시작해요</span>
  </div>

  <div class="cards">
    <div class="card">
      <div class="in">
        <span class="badge">수업 01</span>
        <svg viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>
        <h3>학습 설계</h3>
        <p>CLS 학습코칭검사로 나의 공부법 찾기</p>
        <ul class="items">
          <li><a href="learning-design.html#1-1"><b>1-1</b>CLS 학습코칭검사 안내</a></li>
          <li><a href="learning-design.html#1-2"><b>1-2</b>검사 결과 해석</a></li>
          <li><a href="learning-design.html#1-3"><b>1-3</b>결과지 탐험 &amp; 학습 전략 설계</a></li>
        </ul>
      </div>
    </div>
    <div class="card soon">
      <div class="in">
        <span class="badge">수업 02</span>
        <p>다음 수업이 곧 열려요</p>
      </div>
    </div>
  </div>
</main>
<footer>꿈it(잇)다 진로 수업 · 매탄중학교 진로상담실</footer>
</body>
</html>
